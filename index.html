function type(c){if(done)return;if(c==='←')input=input.slice(0,-1);else if(input.length<answer.length)input+=c;render()}function submit(){if(done)return;if(input.length!==answer.length){$('msg').textContent=`${answer.length}칸을 모두 채워주세요.`;return}rows.push(input);won=input===answer;input='';done=won||rows.length===5;if(done){stat.played++;if(won){stat.wins++;stat.attempts+=rows.length;stat.streak++;celebrate()}else stat.streak=0;save('hg.stats',stat)}persist();render();if(done)showResult();else $('msg').textContent='아쉬워요! 남은 기회 '+(5-rows.length)+'회'}function showResult(){$('resultIcon').textContent=won?'🎉':'😢';$('resultTitle').textContent=won?'정답을 맞혔어요!':'도전 실패';$('resultWord').textContent=word;$('resultDetail').textContent=won?rows.length+'번 만에 성공했어요!':'5번의 기회를 모두 사용했어요.';$('resultNext').textContent=mode==='free'?'다음 문제':'무한 도전 시작';$('result').hidden=false}$('resultClose').onclick=()=>{$('result').hidden=true};$('resultNext').onclick=()=>start('free',true);$('resultShare').onclick=()=>$('share').click();function celebrate(){for(let i=0;i<55;i++){let e=document.createElement('i');e.className='piece';e.style.left=Math.random()*100+'%';e.style.background=['#86d994','#ffe17b','#8ea8ff','#f49ac2'][i%4];e.style.animationDelay=Math.random()*.5+'s';$('confetti').append(e);setTimeout(()=>e.remove(),2700)}}for(let line of ['ㅂㅈㄷㄱㅅㅛㅕㅑ','ㅁㄴㅇㄹㅎㅗㅓㅏㅣ','ㅋㅌㅊㅍㅠㅜㅡ←']){let row=document.createElement('div');row.className='keys';for(let c of line){let b=document.createElement('button');b.textContent=c;b.dataset.key=c;b.onclick=()=>type(c);row.append(b)}$('keyboard').append(row)}$('submit').onclick=submit;$('daily').onclick=()=>start('daily');$('free').onclick=()=>start('free');$('next').onclick=()=>{if(done||confirm('현재 문제를 포기하고 새 문제를 시작할까요?'))start('free',true)};document.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();submit()}else if(e.key==='Backspace'){e.preventDefault();type('←')}else{let map={q:'ㅂ',w:'ㅈ',e:'ㄷ',r:'ㄱ',t:'ㅅ',y:'ㅛ',u:'ㅕ',i:'ㅑ',o:'ㅗㅣ',p:'ㅓㅣ',a:'ㅁ',s:'ㄴ',d:'ㅇ',f:'ㄹ',g:'ㅎ',h:'ㅗ',j:'ㅓ',k:'ㅏ',l:'ㅣ',z:'ㅋ',x:'ㅌ',c:'ㅊ',v:'ㅍ',b:'ㅠ',n:'ㅜ',m:'ㅡ'};let c=map[e.key];if(c)for(let j of c)type(j);else if(/^[ㄱ-ㅣ가-힣]$/.test(e.key))for(let j of decompose(e.key))type(j)}});$('share').onclick=async()=>{if(!done){$('msg').textContent='게임을 마친 뒤 공유할 수 있어요.';return}let text=`하루한글 🧩 ${mode==='daily'?day():'무한 도전'}\n${won?rows.length:'X'}/5\n`+rows.map(g=>score(g).map(c=>({g:'🟩',y:'🟨',x:'⬛'}[c])).join('')).join('\n');try{if(navigator.share)await navigator.share({text});else if(navigator.clipboard){await navigator.clipboard.writeText(text);$('msg').textContent='결과를 복사했어요.'}else prompt('결과를 복사하세요',text)}catch(e){if(e.name!=='AbortError')prompt('결과를 복사하세요',text)}};function tick(){let now=Date.now()+9*3600000,remain=86400-Math.floor(now/1000)%86400;$('clock').textContent='다음 일일 문제까지 '+[Math.floor(remain/3600),Math.floor(remain%3600/60),remain%60].map(n=>String(n).padStart(2,'0')).join(':');if(mode==='daily'&&key!=='hg.v2.'+length+'.daily'+day())start('daily')}for(let n of [5,6,7])$('len'+n).onclick=()=>{length=n;save('hg.length',n);start(mode)};start('daily');tick();setInterval(tick,1000);
