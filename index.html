<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>하루한글</title><style>
*{box-sizing:border-box}body{margin:0;background:#f6f7f9;color:#20242b;font-family:system-ui,sans-serif}main{max-width:520px;margin:auto;background:white;min-height:100dvh;padding:20px 14px;text-align:center}h1{font-size:28px;margin:12px}p{font-size:14px;color:#727782}button{font:inherit;border:0;border-radius:12px;padding:12px;background:#edf0f4;color:#222;cursor:pointer;font-weight:700}button:active{transform:scale(.96)}.tabs{display:flex;gap:8px;justify-content:center}.active,.primary{background:#222b39;color:white}.board{display:grid;gap:7px;margin:24px auto;max-width:420px}.tile{aspect-ratio: .85;border:1px solid #dce0e5;border-radius:12px;display:grid;place-items:center;font-size:clamp(19px,5vw,30px);font-weight:800}.g{background:#86d994!important;border-color:#86d994}.y{background:#ffe17b!important;border-color:#ffe17b}.x{background:#cbd0d5!important;border-color:#cbd0d5}.keys{display:flex;gap:4px;justify-content:center;margin:5px 0}.keys button{flex:1;padding:14px 0;max-width:49px;font-size:20px}.primary{width:100%;margin-top:12px}.stats{display:flex;justify-content:space-around;margin:20px 0}.stats b{display:block;font-size:24px}.stats small{color:#777}.actions{display:flex;gap:8px}.actions button{flex:1}#msg{min-height:24px;font-weight:700;color:#536277}#confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden}.piece{position:absolute;top:-20px;width:9px;height:15px;animation:fall 2s ease-in forwards}@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:0}}details{text-align:left;font-size:14px;line-height:1.8;margin-top:20px}#clock{font-size:13px;color:#777}</style><main><small>DAILY KOREAN WORD GAME</small><h1>하루한글 🧩</h1><p>자음과 모음으로 오늘의 단어를 찾아보세요.</p><div class="tabs"><button id="daily">오늘의 단어</button><button id="free">무한 도전</button></div><p id="info"></p><div id="board" class="board"></div><div id="msg" role="status"></div><div id="keyboard"></div><button class="primary" id="submit">정답 제출</button><div class="stats" id="stats"></div><div class="actions"><button id="share">결과 공유</button><button id="next">새 문제</button></div><p id="clock"></p><details><summary>게임 방법</summary>초록색: 글자와 위치가 모두 맞아요.<br>노란색: 글자는 맞지만 위치가 달라요.<br>회색: 정답에 없거나 필요한 개수를 초과했어요.<br>겹모음과 겹받침은 기본 자모로 나누어 입력하세요. 5번 안에 정답을 맞혀 보세요.<br>현재는 내장 단어 목록에서 문제를 출제하며, 입력 단어의 사전 등재 여부는 검사하지 않습니다.</details></main><div id="confetti"></div><script>
const $=id=>document.getElementById(id), words='감소 감사 감자 가방 가을 겨울 여름 봄날 바다 하늘 구름 나무 사랑 사람 마음 소원 기차 기분 여행 행복 미소 우산 사과 포도 수박 딸기 자두 모자 신발 양말 책상 의자 학교 친구 가족 노래 음악 사진 편지 연필 종이 바람 햇살 달빛 별빛 새벽 저녁 아침 점심 커피 우유 과자 빵집 시장 도시 거리 공원 꽃잎 나비 토끼 고양이 강아지 다람쥐 무지개 도서관 자전거 자동차 비행기 손목시계 운동화 놀이터 해바라기 민들레 고구마 감자탕 떡볶이 김치찌개 된장국 도시락 대한민국 다슬기 도서실 대사극 대사관 다각형 다락방 다리미 단풍잎 동물원 눈사람 소나무 오르골 초콜릿 솜사탕 보름달 별자리'.split(' '), C='ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ',V='ㅏㅐㅑㅒㅓㅔㅕㅖㅗㅘㅙㅚㅛㅜㅝㅞㅟㅠㅡㅢㅣ',T=['','ㄱ','ㄲ','ㄳ','ㄴ','ㄵ','ㄶ','ㄷ','ㄹ','ㄺ','ㄻ','ㄼ','ㄽ','ㄾ','ㄿ','ㅀ','ㅁ','ㅂ','ㅄ','ㅅ','ㅆ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'], split={ㅘ:'ㅗㅏ',ㅙ:'ㅗㅏㅣ',ㅚ:'ㅗㅣ',ㅝ:'ㅜㅓ',ㅞ:'ㅜㅓㅣ',ㅟ:'ㅜㅣ',ㅢ:'ㅡㅣ',ㅐ:'ㅏㅣ',ㅔ:'ㅓㅣ',ㅒ:'ㅑㅣ',ㅖ:'ㅕㅣ',ㄲ:'ㄱㄱ',ㄸ:'ㄷㄷ',ㅃ:'ㅂㅂ',ㅆ:'ㅅㅅ',ㅉ:'ㅈㅈ',ㄳ:'ㄱㅅ',ㄵ:'ㄴㅈ',ㄶ:'ㄴㅎ',ㄺ:'ㄹㄱ',ㄻ:'ㄹㅁ',ㄼ:'ㄹㅂ',ㄽ:'ㄹㅅ',ㄾ:'ㄹㅌ',ㄿ:'ㄹㅍ',ㅀ:'ㄹㅎ',ㅄ:'ㅂㅅ'};function decompose(w){return [...w].map(c=>{let n=c.charCodeAt(0)-44032;return n>=0&&n<11172?C[Math.floor(n/588)]+V[Math.floor(n%588/28)]+T[n%28]:c}).join('').split('').map(c=>split[c]||c).join('')}
function read(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}}function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}function day(){return new Date(Date.now()+9*3600000).toISOString().slice(0,10)}let mode='daily',word,answer,rows,input='',done=false,won=false,key,stat=read('hg.stats',{played:0,wins:0,attempts:0,streak:0});function start(m,fresh=false){mode=m;key='hg.'+m+(m==='daily'?day():'');let s=fresh?null:read(key,null);let index=Math.floor(Date.parse(day())/86400000)%words.length;word=s?.word||(m==='daily'?words[index]:words[Math.floor(Math.random()*words.length)]);answer=decompose(word);rows=s?.rows||[];done=s?.done||false;won=s?.won||false;input='';persist();render()}function persist(){save(key,{word,rows,done,won})}function score(g){let a=[...answer],out=Array(a.length).fill('x');[...g].forEach((c,i)=>{if(c===a[i]){out[i]='g';a[i]=null}});[...g].forEach((c,i)=>{if(out[i]==='g')return;let j=a.indexOf(c);if(j>=0){out[i]='y';a[j]=null}});return out}function render(){ $('daily').className=mode==='daily'?'active':'';$('free').className=mode==='free'?'active':'';$('info').textContent=`${answer.length}칸 · ${rows.length}/5회 · ${mode==='daily'?day():'연습 모드'}`;$('board').style.gridTemplateColumns=`repeat(${answer.length},minmax(0,1fr))`;$('board').innerHTML='';let marks={},rank={x:1,y:2,g:3};for(let r=0;r<5;r++){let g=rows[r],s=g?score(g):[];for(let i=0;i<answer.length;i++){let c=g?.[i]||(r===rows.length?input[i]:'')||'',el=document.createElement('div');el.className='tile '+(s[i]||'');el.textContent=c;$('board').append(el);if(g&&(!marks[c]||rank[s[i]]>rank[marks[c]]))marks[c]=s[i]}}document.querySelectorAll('[data-key]').forEach(b=>b.className=marks[b.dataset.key]||'');$('msg').textContent=done?(won?'정답! 🎉 ':'도전 종료 · 정답: ')+word:'';$('submit').disabled=done;$('submit').style.opacity=done?.5:1;$('next').hidden=mode==='daily';$('stats').innerHTML=[['플레이',stat.played],['승률',stat.played?Math.round(stat.wins/stat.played*100)+'%':'0%'],['평균 시도',stat.wins?(stat.attempts/stat.wins).toFixed(1):'–'],['연승',stat.streak]].map(([k,v])=>`<div><b>${v}</b><small>${k}</small></div>`).join('')}
function type(c){if(done)return;if(c==='←')input=input.slice(0,-1);else if(input.length<answer.length)input+=c;render()}function submit(){if(done)return;if(input.length!==answer.length){$('msg').textContent=`${answer.length}칸을 모두 채워주세요.`;return}rows.push(input);won=input===answer;input='';done=won||rows.length===5;if(done){stat.played++;if(won){stat.wins++;stat.attempts+=rows.length;stat.streak++;celebrate()}else stat.streak=0;save('hg.stats',stat)}persist();render()}function celebrate(){for(let i=0;i<55;i++){let e=document.createElement('i');e.className='piece';e.style.left=Math.random()*100+'%';e.style.background=['#86d994','#ffe17b','#8ea8ff','#f49ac2'][i%4];e.style.animationDelay=Math.random()*.5+'s';$('confetti').append(e);setTimeout(()=>e.remove(),2700)}}for(let line of ['ㅂㅈㄷㄱㅅㅛㅕㅑ','ㅁㄴㅇㄹㅎㅗㅓㅏㅣ','ㅋㅌㅊㅍㅠㅜㅡ←']){let row=document.createElement('div');row.className='keys';for(let c of line){let b=document.createElement('button');b.textContent=c;b.dataset.key=c;b.onclick=()=>type(c);row.append(b)}$('keyboard').append(row)}$('submit').onclick=submit;$('daily').onclick=()=>start('daily');$('free').onclick=()=>start('free');$('next').onclick=()=>{if(done||confirm('현재 문제를 포기하고 새 문제를 시작할까요?'))start('free',true)};document.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();submit()}else if(e.key==='Backspace'){e.preventDefault();type('←')}else{let map={q:'ㅂ',w:'ㅈ',e:'ㄷ',r:'ㄱ',t:'ㅅ',y:'ㅛ',u:'ㅕ',i:'ㅑ',o:'ㅗㅣ',p:'ㅓㅣ',a:'ㅁ',s:'ㄴ',d:'ㅇ',f:'ㄹ',g:'ㅎ',h:'ㅗ',j:'ㅓ',k:'ㅏ',l:'ㅣ',z:'ㅋ',x:'ㅌ',c:'ㅊ',v:'ㅍ',b:'ㅠ',n:'ㅜ',m:'ㅡ'};let c=map[e.key];if(c)for(let j of c)type(j);else if(/^[ㄱ-ㅣ가-힣]$/.test(e.key))for(let j of decompose(e.key))type(j)}});$('share').onclick=async()=>{if(!done){$('msg').textContent='게임을 마친 뒤 공유할 수 있어요.';return}let text=`하루한글 🧩 ${mode==='daily'?day():'무한 도전'}\n${won?rows.length:'X'}/5\n`+rows.map(g=>score(g).map(c=>({g:'🟩',y:'🟨',x:'⬛'}[c])).join('')).join('\n');try{if(navigator.share)await navigator.share({text});else if(navigator.clipboard){await navigator.clipboard.writeText(text);$('msg').textContent='결과를 복사했어요.'}else prompt('결과를 복사하세요',text)}catch(e){if(e.name!=='AbortError')prompt('결과를 복사하세요',text)}};function tick(){let now=Date.now()+9*3600000,remain=86400-Math.floor(now/1000)%86400;$('clock').textContent='다음 일일 문제까지 '+[Math.floor(remain/3600),Math.floor(remain%3600/60),remain%60].map(n=>String(n).padStart(2,'0')).join(':');if(mode==='daily'&&key!=='hg.daily'+day())start('daily')}start('daily');tick();setInterval(tick,1000);
</script></html>
